<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCTrack</title>
    <link rel="stylesheet" href="vendor/tokens.css" />
    <link rel="stylesheet" href="vendor/base.css" />
    <link rel="stylesheet" href="vendor/components.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <h1 class="tracker-title">
          <img src="icons/square-terminal-32.png" width="20" height="20" alt="" />
          <span>LC TRACK</span>
        </h1>
        <button id="open-dashboard" class="btn dashboard-action" type="button">Dashboard ↗</button>
      </header>

      <section class="problem-panel" aria-labelledby="problem-title">
        <div class="problem-kicker">
          <span id="problem-number">—</span>
          <span id="problem-difficulty" class="badge">UNKNOWN</span>
        </div>
        <h2 id="problem-title" class="problem-title">OPEN A LEETCODE PROBLEM</h2>
        <div class="review-row">
          <span>REVIEW</span>
          <span id="review-state" class="badge badge--muted">READING…</span>
        </div>
        <ul id="problem-topics" class="topics" aria-label="Problem topics"></ul>
      </section>

      <section class="capture-section" aria-labelledby="capture-heading">
        <h2 id="capture-heading" class="section-label">HOW DID THIS ATTEMPT GO?</h2>
        <div id="outcome-actions" class="outcome-actions" hidden>
          <button class="btn outcome" type="button" data-result="Needed help" aria-pressed="false">
            Needed help
          </button>
          <button class="btn outcome" type="button" data-result="Solved" aria-pressed="false">
            Solved
          </button>
        </div>
        <button id="retry-attempt" class="btn btn--block retry" type="button" hidden>
          Retry same attempt
        </button>
        <p id="success-confirmation" class="success-confirmation" hidden></p>
      </section>

      <details id="code-disclosure" class="code-disclosure" open>
        <summary>
          <span>CODE SNAPSHOT</span>
          <span class="code-summary-meta">
            <span id="code-language">UNKNOWN</span>
            <span aria-hidden="true">·</span>
            <span id="code-line-count">0 LINES</span>
          </span>
        </summary>
        <pre id="captured-code" class="captured-code" tabindex="0"></pre>
      </details>

      <section class="feedback" aria-label="Capture status">
        <p id="status" class="status" role="status" aria-live="polite">
          Reading the current LeetCode problem…
        </p>
        <button id="open-options" class="btn btn--quiet settings-action" type="button">
          Bridge settings
        </button>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
